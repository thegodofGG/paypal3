<!-- users.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Send Money</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root{
      --ink:#0b0b0c;
      --muted:#6b7280;
      --line:#e5e7eb;
      --primary:#1d4ed8;
      --bg:#ffffff;
      --bg-soft:#f9fafb;
    }
    body{
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Inter, system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .wrap{
      max-width: 420px;
      margin: 20px auto 40px;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg);
    }

    /* Top: Tab title like screenshot */
    .tabbar{
      padding: 18px 20px 8px;
      border-bottom: 1px solid var(--line);
    }
    .tablabel{
      font-weight: 500;
      font-size: 20px;
      display: inline-block;
      padding-bottom: 10px;
      position: relative;
    }
    .tablabel::after{
      content:"";
      position:absolute;
      left:0; right:0; bottom:0;
      height:2px;
      background:#111827;
      border-radius:2px;
      width: 140px; /* underline width similar to screenshot */
    }

    /* Search */
    .header{ padding:16px 16px 0; }
    .search-box{ position:relative; }
    .search-input{
      width:100%;
      height:48px;
      padding: 0 14px 0 40px;
      border:1px solid var(--line);
      border-radius: 12px;
      font-size:16px;
      outline:none;
      background:#fff;
    }
    .search-input::placeholder{ color:#9ca3af; }
    .search-input:focus{
      border-color:#1e90ff;
      box-shadow: 0 0 0 4px rgba(30,144,255,.15);
    }
    .search-icon{
      position:absolute; left:12px; top:50%;
      transform: translateY(-50%);
      color:#9ca3af; font-size:16px;
    }

    /* Next button + link */
    .actions{
      padding: 12px 16px 0;
    }
    .next-btn{
      width:110px;
      height:42px;
      border-radius: 22px;
      border:1px solid #e6e7eb;
      background:#f3f4f6;
      color:#9aa0a6;
      font-weight:600; font-size:16px;
      cursor:not-allowed;
    }
    .next-btn.enabled{
      background: var(--primary);
      color:#fff;
      cursor:pointer;
      border-color: var(--primary);
    }
    .link{
      display:inline-block;
      margin: 12px 0 8px;
      color:#1d4ed8;
      text-decoration: underline;
      font-size:16px;
    }

    /* Suggestions list (appears as you type) */
    .list{ list-style:none; }
    .suggestion-title{
      padding: 16px;
      font-size: 14px;
      color:#6b7280;
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
      font-weight:600;
    }
    .item{
      display:flex; align-items:center;
      padding:16px;
      border-bottom:1px solid var(--line);
      cursor:pointer;
    }
    .avatar{
      width:40px; height:40px; border-radius:999px;
      background:#eef2ff; color:#6366f1;
      display:flex; align-items:center; justify-content:center;
      font-weight:700; margin-right:12px;
    }
    .info{ display:flex; flex-direction:column; gap:2px; }
    .name{ font-size:16px; font-weight:600; }
    .handle{ font-size:13px; color:#6b7280; }

    /* “More options” section */
    .section-title{
      padding: 18px 16px 10px;
      font-weight:500; font-size:27px;
    }
    .more{
      display:flex; flex-direction:column; gap:8px; padding: 0 8px 16px;
    }
    .more-item{
      display:flex; align-items:center; gap:12px;
      padding:12px 8px; border-radius:10px;
    }
    .more-icon{
      width:38px; height:38px; border-radius:10px;
      background: var(--bg-soft);
      display:flex; align-items:center; justify-content:center;
      color:#111827;
    }
    .more-text{ font-size:16px; font-weight:600; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Tab title -->
    <div class="tabbar">
      <a href="index.html" style="text-decoration:none; color:inherit;">
        <span class="tablabel">Send Money</span>
      </a>
    </div>

    <!-- Search -->
    <div class="header">
      <div class="search-box">
        <i class="fas fa-search search-icon"></i>
        <input id="searchInput" class="search-input" type="text" placeholder="Name, email, mobile" />
      </div>
    </div>

    <!-- Next button + Show all contacts -->
    <div class="actions">
      <button id="sendBtn" class="next-btn" disabled>Next</button>
      <div>
      <a class="link" href="#" onclick="alert('Coming soon')">Show all contacts</a>
      </div>
    </div>

    <!-- Suggestions (filled by JS) -->
    <ul id="suggestionList" class="list"></ul>

    <!-- More options -->
    <div class="section-title">More options</div>
    <div class="more">
      <div class="more-item">
        <div class="more-icon">
          <img src="icon1.png" alt="Pool money" />
        </div>
        <div class="more-text">Pool money</div>
      </div>
      <div class="more-item">
        <div class="more-icon">
          <img src="icon2.png" alt="Split a bill" />
        </div>
        <div class="more-text">Split a bill</div>
      </div>
      <div class="more-item" style="border-bottom:none;">
        <div class="more-icon">
          <img src="icon3.png" alt="Send a digital gift card" />
        </div>
        <div class="more-text">Send a digital gift card</div>
      </div>
    </div>
  </div>

  <script>
    // Seed data (same logic as your file)
    let suggestionsData = JSON.parse(localStorage.getItem("jsonData")) || [];
    if (!suggestionsData.length) {
      suggestionsData = [
        { name: 'John Doe', username: '@john', avatarText: 'JD' },
        { name: 'Jane Smith', username: '@jane', avatarText: 'JS' },
        { name: 'Alice Johnson', username: '@alice', avatarText: 'AJ' }
      ];
    }

    const searchInput = document.getElementById('searchInput');
    const suggestionList = document.getElementById('suggestionList');
    const sendBtn = document.getElementById('sendBtn');

    function selectUser(user) {
      const selectedUser = {
        name: user.name,
        username: user.username.replace(/^@/, ''),
        avatarText: user.avatarText
      };
      try {
        localStorage.setItem('selectedUser', JSON.stringify(selectedUser));
        window.location.href = 'sendMoney.html';
      } catch (e) {
        console.error('Failed to save to localStorage:', e);
        alert('Error saving user data. Please check browser settings.');
      }
    }

    function renderSuggestions(data) {
      suggestionList.innerHTML = '';
      if (!data || !data.length) return;
      // Optional header above list (kept minimal like screenshot: hidden until typing)
      // Uncomment if you want the grey "Suggested" row:
      // const hdr = document.createElement('div');
      // hdr.className = 'suggestion-title';
      // hdr.textContent = 'Suggested';
      // suggestionList.appendChild(hdr);

      data.forEach((user) => {
        const li = document.createElement('li');
        li.className = 'item';

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = user.avatarText;

        const info = document.createElement('div');
        info.className = 'info';

        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = user.name;

        const handle = document.createElement('span');
        handle.className = 'handle';
        handle.textContent = user.username;

        info.appendChild(name);
        info.appendChild(handle);

        li.appendChild(avatar);
        li.appendChild(info);

        li.addEventListener('click', () => selectUser(user));
        suggestionList.appendChild(li);
      });
    }

    // Initially no list shown (matches screenshot feel)
    renderSuggestions([]);

    // Filter as you type (same logic)
    searchInput.addEventListener('input', function () {
      const query = this.value.trim();

      // enable/disable "Next"
      if (query.length > 0) {
        sendBtn.disabled = false;
        sendBtn.classList.add('enabled');
      } else {
        sendBtn.disabled = true;
        sendBtn.classList.remove('enabled');
      }

      if (!query) {
        renderSuggestions([]);
        return;
      }

      let filtered = suggestionsData.filter((user) =>
        user.name.toLowerCase().includes(query.toLowerCase()) ||
        user.username.toLowerCase().includes(query.toLowerCase())
      );

      if (filtered.length === 0) {
        const avatarLetters = query.slice(0, 2).toUpperCase();
        filtered.push({
          name: query,
          username: '@' + query.replace(/\s+/g, ''),
          avatarText: avatarLetters
        });
      }

      renderSuggestions(filtered);
    });

    // “Next” keeps your original behavior: create/select from input
    sendBtn.addEventListener('click', () => {
      const query = searchInput.value.trim();
      if (!query) return;

      const avatarLetters = query.slice(0, 2).toUpperCase();
      const user = {
        name: query,
        username: '@' + query.replace(/\s+/g, ''),
        avatarText: avatarLetters
      };
      selectUser(user);
    });
  </script>
</body>
</html>
